name: desktop_core
description: Shared presentation, HTTP, and native-command infrastructure for Hudu desktop tools.
publish_to: none
version: 1.0.0
environment:
  sdk: ^3.13.2
dependencies:
  flutter:
    sdk: flutter
  # Only lib/testing.dart imports flutter_test; it is not exported by
  # desktop_core.dart, so release builds never compile it.
  flutter_test:
    sdk: flutter
  http: ^1.6.0
dev_dependencies:
  flutter_lints: ^6.0.0
flutter:
  assets:
    - assets/fonts/OFL.txt
    - assets/fonts/JetBrainsMono-OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
