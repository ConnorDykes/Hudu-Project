<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Hudu Project — Desktop utilities, thoughtfully engineered</title>
  <desc id="description">Original project artwork in dark navy and mint. Precision connector lines link abstract network and process symbols. This is a project banner, not an application screenshot or a corporate logo.</desc>
